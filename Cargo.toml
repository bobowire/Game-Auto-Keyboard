[package]
name = "game-auto-keyboard"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
eframe = "0.29"
egui = "0.29"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

# 并发
crossbeam-channel = "0.5"

# 序列化（配置保存）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# 系统托盘
tray-icon = "0.19"

[build-dependencies]
winres = "0.1"
