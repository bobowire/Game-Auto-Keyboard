[package]
name = "game-auto-keyboard"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
eframe = "0.29"
egui = "0.29"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_Xps",
    "Win32_Media_Audio",
    "Win32_Media",
] }

# 并发
crossbeam-channel = "0.5"

# 序列化（配置保存）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
log = "0.4"
env_logger = "0.11"

# 系统托盘
tray-icon = "0.19"
# 取主窗口 HWND（版本与 eframe 0.29 依赖的一致，避免 RawWindowHandle 类型不匹配）
raw-window-handle = "0.6.2"

# 音频采集（语音控制）
cpal = "0.15"
rustpotter = "3.0.2"
webrtc-vad = "0.4.0"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
nnnoiseless = { version = "0.5", default-features = false }

[build-dependencies]
winres = "0.1"
